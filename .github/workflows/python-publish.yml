# Publish to PyPI when a version tag (e.g. v0.0.13) is pushed. Bump the
# version in pyproject.toml yourself, commit it, then push a matching tag
# to cut a release - nothing publishes automatically on ordinary pushes.
# The test suite (test.yml) must pass against a real NetBox checkout before
# the tag is allowed to publish - see the `test` job below. Once published,
# the `release` job creates the matching GitHub Release with generated notes
# and the `blog` job posts those notes to WordPress (secrets WP_URL, WP_USER,
# WP_APP_PASSWORD).

name: Upload Python Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Verify tag matches pyproject.toml version
      run: |
        python <<'PY'
        import os
        import re
        import sys
        from pathlib import Path

        tag_version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
        text = Path('pyproject.toml').read_text(encoding='utf-8')
        match = re.search(r'^version = "(\d+\.\d+\.\d+)"', text, re.M)
        if not match:
            sys.exit('Could not find version = "X.Y.Z" in pyproject.toml')
        pyproject_version = match.group(1)
        if tag_version != pyproject_version:
            sys.exit(
                f'Tag v{tag_version} does not match pyproject.toml version {pyproject_version}'
            )
        PY

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  blog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Publish the release notes to WordPress
      env:
        GH_TOKEN: ${{ github.token }}
        WP_URL: ${{ secrets.WP_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      run: |
        pip install --quiet markdown
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body,url > release.json
        python - <<'PY'
        import json
        import os
        import markdown

        release = json.load(open('release.json'))
        content = markdown.markdown(release['body'])
        content += f'<p><a href="{release["url"]}">View the release on GitHub</a></p>'
        payload = {
            'title': f'netbox-services {os.environ["GITHUB_REF_NAME"]} released',
            'content': content,
            'status': 'publish',
        }
        json.dump(payload, open('post.json', 'w'))
        PY
        curl --fail-with-body --silent --show-error \
          --user "$WP_USER:$WP_APP_PASSWORD" \
          --header 'Content-Type: application/json' \
          --data @post.json \
          "${WP_URL%/}/wp-json/wp/v2/posts" | python -c 'import json,sys; print("Published:", json.load(sys.stdin)["link"])'
